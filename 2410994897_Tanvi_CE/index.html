<!DOCTYPE html>
<html>
<head>
    <title>Savana Shopping</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>SAVANA</h1>
        <p>Find Your Style. Shop Your Way.</p>
    </header>

    <main>
        <!-- Search and Filter Products -->
        <div class="filters">
            <input type="text" id="search" placeholder="Search products...">

            <select id="category">
                <option value="all">All Categories</option>
                <option value="Men">Men</option>
                <option value="Women">Women</option>
                <option value="Accessories">Accessories</option>
            </select>

            <select id="sort">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>
        </div>

        <!-- Products -->
        <h2>Our Products</h2>
        <div id="products"></div>

        <!-- Shopping Cart -->
        <section id="cart">
            <h2>Shopping Cart</h2>

            <div id="cart-items">
                <p>Your cart is empty.</p>
            </div>

            <p>Subtotal: ₹<span id="subtotal">0</span></p>
            <p>Discount: ₹<span id="discount">0</span></p>
            <p id="total">Total: ₹<span id="total-amount">0</span></p>

            <!-- Coupon -->
            <h3>Apply Coupon</h3>
            <input type="text" id="coupon" placeholder="Enter coupon code (eg. SAVE10)">
            <button id="apply-coupon">Apply Coupon</button>
            <p id="coupon-message"></p>

            <!-- Checkout -->
            <button id="checkout">Proceed to Checkout</button>
        </section>

        <!-- Checkout Form -->
        <form id="checkout-form" style="display: none;">
            <h2>Checkout Details</h2>

            <input type="text" id="customer-name" placeholder="Full Name" required>

            <input type="email" id="customer-email" placeholder="Email Address" required>

            <input type="text" id="customer-address" placeholder="Delivery Address" required>
            <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option value="COD">Cash on Delivery</option>
                <option value="UPI">UPI</option>
                <option value="Card">Debit/Credit Card</option>
            </select>

            <button type="submit">Place Order</button>
        </form>

    </main>

    <script src="script.js"></script>

</body>
</html>
